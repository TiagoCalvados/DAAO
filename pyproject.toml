[build-system]
requires = ["uv_build>=0.11.26,<0.13"]
build-backend = "uv_build"

[project]
name = "daao"
version = "0.3.4"
description = "DIY Astronomical Attic Observatory desktop receiver and overlay"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {file = "LICENSE"}
authors = [{name = "Tiago Calvados"}]
dependencies = [
    "PySide6==6.11.1",
]

[project.gui-scripts]
daao = "daao.app:main"

[tool.uv]
required-version = ">=0.11.26,<0.13"
system-certs = true
